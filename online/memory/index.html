<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
<title>Memory — online</title>
<!-- Look & feel: identical to the single-player Memory (../../memory/index.html): same cards (3D flip, dot-grid back, emoji),
     same 4×3 layout, colours and wording. Only what two players need is added (whose pair it is, both scores, the
     opponent's live cursor, a phone layout). -->
<style>
  :root {
    --bg:      #0e0e1c;
    --cover:   #16163a;
    --face:    #1e1e40;
    --accent:  #6c63ff;
    --matched: #00c897;
    --green:   #22bb33;
    --red:     #dd2200;
    --yellow:  #ddaa00;
    --dim:     #555;
    --text:    #e0e0e0;
    --p1: #4488ff; --p2: #ff6633;                        /* host / guest: who took a pair */
    --me: var(--p1); --opp: var(--p2);
    --cell:    min(16vh, 13vw);
    --gap:     10px;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', Arial, sans-serif;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; user-select: none; -webkit-user-select: none; touch-action: manipulation;
  }
  #game {
    display: flex; flex-direction: column;
    align-items: center; gap: 0.7rem;
    padding: 0.5rem;
  }
  /* TV (landscape) only: leaves the top-right corner clear for the call thumbnail (DEVELOPING.md R36) —
     already true today by being centered and compact; this just makes sure a future change can't grow
     into it unnoticed. The phone never shows that thumbnail, so it keeps the full width. */
  @media (min-aspect-ratio: 1/1) {
    #game { max-width: 78vw; }
  }
  h1 {
    font-size: 3rem; font-weight: 900; letter-spacing: .06em;
  }
  #status {
    font-size: 2.2rem; font-weight: 700; min-height: 2.7rem;
    text-align: center; letter-spacing: .02em;
    transition: color .25s;
  }
  #status.your-turn { color: #4488ff; }
  #status.waiting   { color: var(--yellow); }
  #status.matched   { color: var(--matched); }
  #status.no-match  { color: var(--red); }
  #status.win       { color: var(--green); }
  #status.lose      { color: var(--red); }
  #status.idle      { color: var(--dim); }

  #board {
    display: grid;
    gap: var(--gap);
    grid-template-columns: repeat(4, var(--cell));
    grid-template-rows: repeat(3, var(--cell));
  }

  /* Card flip */
  .card {
    width: var(--cell); height: var(--cell);
    perspective: 800px;
    cursor: pointer;
  }
  .card-inner {
    width: 100%; height: 100%;
    position: relative;
    transform-style: preserve-3d;
    transition: transform .38s ease;
    border-radius: 14px;
  }
  .card.flipped .card-inner,
  .card.matched .card-inner { transform: rotateY(180deg); }

  .card-cover, .card-face {
    position: absolute; inset: 0;
    border-radius: 14px;
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
    display: flex; align-items: center; justify-content: center;
  }

  /* Face-down side — dot-grid pattern */
  .card-cover {
    background: var(--cover);
    border: 2px solid #2a2a5a;
    background-image: radial-gradient(circle, #2e2e6a 1.5px, transparent 1.5px);
    background-size: calc(var(--cell) / 5) calc(var(--cell) / 5);
  }
  /* Focus ring on cover only */
  .card.focused .card-cover {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px #6c63ff55;
  }
  /* The opponent's live cursor: a dashed ring in their colour */
  .card.opp-focused .card-cover {
    outline: 3px dashed var(--opp); outline-offset: 2px;
  }

  /* Face-up side — emoji symbol */
  .card-face {
    background: var(--face);
    border: 2px solid #333366;
    transform: rotateY(180deg);
    font-size: calc(var(--cell) * 0.52);
    line-height: 1;
  }

  /* Matched glow — in the colour of the player who took the pair */
  .card.matched .card-face {
    border-color: var(--matched);
    box-shadow: 0 0 18px 5px #00c89755;
  }
  .card.matched.by1 .card-face { border-color: var(--p1); box-shadow: 0 0 18px 5px #4488ff55; }
  .card.matched.by2 .card-face { border-color: var(--p2); box-shadow: 0 0 18px 5px #ff663355; }

  #meta {
    display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: .4rem 1.4rem;
    color: var(--dim); font-size: 0.9rem;
  }
  #pairs-count { font-size: 1.5rem; color: var(--text); font-weight: 700; }
  #versus b { font-size: 1.2rem; }
  #me-badge { display: inline-flex; align-items: center; gap: .4rem; padding: .1rem .6rem; border: 1px solid #333; border-radius: 99px; }
  #me-dot { width: .8em; height: .8em; border-radius: 50%; background: var(--me); }

  @media (max-aspect-ratio: 1/1) {                       /* phone in portrait: the same, sized for the width */
    :root { --cell: min(calc((100vw - 48px) / 4), 15vh); --gap: 8px; }
    h1 { font-size: 1.8rem; }
    #status { font-size: 1.3rem; min-height: 1.8rem; }
    #pairs-count { font-size: 1.2rem; }
    #meta { font-size: .8rem; gap: .3rem 1rem; }
  }
</style>
</head>
<body>
<div id="game">
  <h1 id="title-el"></h1>
  <div id="status" class="idle"></div>
  <div id="board"></div>
  <div id="meta">
    <span id="pairs-count"></span>
    <span id="versus"></span>
    <span id="score"></span>
    <span id="me-badge"><span id="me-dot"></span><span id="me-text"></span></span>
    <span id="hint"></span>
  </div>
</div>

<script src="../elda-online.js"></script>
<script>
// ── i18n (en / fr / nl) — the single-player wording where it exists. No text-to-speech: online games run during a video call. ──
const PARAMS = new URLSearchParams(location.search);
const LANG = (() => {
  const l = (PARAMS.get("lang") || "en").split(/[-_]/)[0].toLowerCase();
  return ["fr", "nl"].includes(l) ? l : "en";
})();
const T = {
  en: { title: "Memory", yourTurn: "Find a pair", matched: "Match! ✓", noMatch: "No match", youWin: "You win! 🎉", youLose: "You lose", draw: "Draw!",
        pressAgain: "Press any key to play again", waitAgain: "Waiting for your opponent…", oppAgain: "Your opponent wants a rematch — press any key",
        oppTurn: "Opponent's turn", waitOpp: "Waiting for your opponent…", connecting: "Connecting…", lost: "Connection lost — waiting…",
        oppLeft: "Your opponent left the game", playBlue: "You are blue", playOrange: "You are orange", you: "You", opp: "Opponent",
        pairs: (f, t) => `${f} / ${t} pairs`, games: "Games {me} – {opp}",
        hint: "↑ ↓ ← →  move   Enter / A  flip", hintTouch: "Tap a card to select it, tap it again to flip it" },
  fr: { title: "Memory", yourTurn: "Trouvez une paire", matched: "Paire ! ✓", noMatch: "Pas de paire", youWin: "Vous gagnez ! 🎉", youLose: "Vous perdez", draw: "Égalité !",
        pressAgain: "Appuyez sur une touche pour rejouer", waitAgain: "En attente de votre adversaire…", oppAgain: "Votre adversaire veut rejouer — appuyez sur une touche",
        oppTurn: "Tour de l'adversaire", waitOpp: "En attente de votre adversaire…", connecting: "Connexion…", lost: "Connexion perdue — en attente…",
        oppLeft: "Votre adversaire a quitté la partie", playBlue: "Vous êtes bleu", playOrange: "Vous êtes orange", you: "Vous", opp: "Adversaire",
        pairs: (f, t) => `${f} / ${t} paires`, games: "Parties {me} – {opp}",
        hint: "↑ ↓ ← →  déplacer   Entrée / A  retourner", hintTouch: "Touchez une carte pour la choisir, touchez-la à nouveau pour la retourner" },
  nl: { title: "Memory", yourTurn: "Zoek een paar", matched: "Paar! ✓", noMatch: "Geen paar", youWin: "U wint! 🎉", youLose: "U verliest", draw: "Gelijkspel!",
        pressAgain: "Druk een toets in om opnieuw te spelen", waitAgain: "Wachten op uw tegenstander…", oppAgain: "Uw tegenstander wil opnieuw spelen — druk een toets in",
        oppTurn: "Beurt van de tegenstander", waitOpp: "Wachten op uw tegenstander…", connecting: "Verbinden…", lost: "Verbinding verbroken — wachten…",
        oppLeft: "Uw tegenstander heeft het spel verlaten", playBlue: "U bent blauw", playOrange: "U bent oranje", you: "U", opp: "Tegenstander",
        pairs: (f, t) => `${f} / ${t} paar`, games: "Spellen {me} – {opp}",
        hint: "↑ ↓ ← →  bewegen   Enter / A  omdraaien", hintTouch: "Tik op een kaart om te kiezen, tik nogmaals om om te draaien" },
}[LANG];

// ── Sound effects — the same as the single-player game (sound effects only, no speech) ──
let audioCtx = null;
function beep(freq, type, duration, volume = 0.35, startDelay = 0) {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination); o.type = type; o.frequency.value = freq;
    const t = audioCtx.currentTime + startDelay;
    g.gain.setValueAtTime(volume, t); g.gain.exponentialRampToValueAtTime(0.001, t + duration);
    o.start(t); o.stop(t + duration);
  } catch (_) {}
}
const unlockAudio = () => { if (audioCtx && audioCtx.state === "suspended") audioCtx.resume(); };
const playFlip    = () => beep(700, "sine", 0.07, 0.18);
const playMatch   = () => { beep(523, "sine", 0.15, 0.35, 0); beep(784, "sine", 0.22, 0.35, 0.14); };
const playNoMatch = () => beep(220, "sawtooth", 0.20, 0.22);
const playWin     = () => [[523, 0], [659, .13], [784, .26], [1046, .40]].forEach(([f, d]) => beep(f, "sine", .28, .4, d));
const playLose    = () => { beep(200, "sawtooth", .35, .25, 0); beep(160, "sawtooth", .45, .25, .35); };
const playDraw    = () => { beep(350, "sine", .2, .3, 0); beep(350, "sine", .2, .3, .28); };

// ── The cards: the same six symbols, in a 4×3 grid, as the single-player game ──
const SYMBOLS = ["⭐", "🌙", "🎵", "❤️", "🌺", "🍀"];
const PAIRS = SYMBOLS.length, CARDS = 2 * PAIRS, COLS = 4, ROWS = CARDS / COLS;
const RESOLVE_MATCH_MS = 900, RESOLVE_MISS_MS = 1700;      // how long the two cards stay visible before they resolve

// ── GAME STATE: the HOST owns it and publishes it whole ────────────────────
//   st: 0 face down, 1 face up (not yet resolved), 2 matched (own[i] = who took the pair)
//   up: the indices currently face up; busy: two are up and the host is about to resolve them
const EPOCH = Math.random().toString(36).slice(2, 10);
function shuffled() {
  const a = []; for (let s = 0; s < PAIRS; s++) a.push(s, s);
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function newRound(starter, score) {
  return { sym: shuffled(), st: Array(CARDS).fill(0), own: Array(CARDS).fill(0), up: [], busy: false,
           turn: starter, starter, status: "playing", winner: 0, ply: 0, pairs: { 1: 0, 2: 0 },
           score: score || { 1: 0, 2: 0 }, rematch: { 1: false, 2: false }, epoch: EPOCH, rev: 0 };
}
function validSnapshot(s) {
  const arr = (a, f) => Array.isArray(a) && a.length === CARDS && a.every(f);
  return !!s && arr(s.sym, (v) => Number.isInteger(v) && v >= 0 && v < PAIRS) && arr(s.st, (v) => v === 0 || v === 1 || v === 2)
    && arr(s.own, (v) => v === 0 || v === 1 || v === 2) && Array.isArray(s.up) && s.up.length <= 2 && s.up.every((i) => Number.isInteger(i) && i >= 0 && i < CARDS)
    && (s.turn === 1 || s.turn === 2) && ["playing", "won", "draw"].includes(s.status) && Number.isInteger(s.ply) && s.pairs && s.score && s.rematch;
}
const clone = (o) => JSON.parse(JSON.stringify(o));

let S = null, sess = null, me = 1;
let cursor = 5;                  // my cursor (a card 0..11)
let armed = null;                // touch: the card I tapped once (a second tap flips it)
let oppCur = null;               // the opponent's live cursor
let showAgain = false, againTimer = null;   // like the single-player game: the result first, then "press any key to play again"
let linked = false, everLinked = false, peerLeft = false;
let pending = false, pendingRev = null, pendingToken = 0;
let resolveTimer = null;         // host: the timer that turns two face-up cards into a pair or back down
const TOUCH = typeof matchMedia === "function" && matchMedia("(pointer: coarse)").matches;
let lastFocusSent = 0, focusTimer = null;

const myTurn = () => !!S && linked && !peerLeft && S.status === "playing" && S.turn === me;
const canPlay = () => myTurn() && !S.busy && !pending;

// ── DOM: the cards are built once, so that flipping can animate ────────────
const $ = (id) => document.getElementById(id);
$("title-el").textContent = T.title;
const cardEls = [];
function buildBoard() {
  const board = $("board"); board.innerHTML = "";
  for (let i = 0; i < CARDS; i++) {
    const el = document.createElement("div"), inner = document.createElement("div"),
          cover = document.createElement("div"), face = document.createElement("div");
    el.className = "card"; inner.className = "card-inner"; cover.className = "card-cover"; face.className = "card-face";
    inner.appendChild(cover); inner.appendChild(face); el.appendChild(inner);
    el.addEventListener("click", () => {
      unlockAudio();
      if (S && S.status !== "playing") { requestRematch(); return; }                                          // after the game: play again
      cursor = i;
      if (TOUCH && canPlay() && S && S.st[i] === 0 && armed !== i) { armed = i; render(); sendFocus(); return; }   // touch: select first…
      activate(i);                                                                                             // …then flip
    });
    board.appendChild(el);
    cardEls.push({ el, face });
  }
}
buildBoard();
function setStatus(text, cls) { $("status").textContent = text; $("status").className = cls; }

function render() {
  const showOpp = !!S && S.status === "playing" && linked && !peerLeft && S.turn === 3 - me && oppCur !== null;
  cardEls.forEach((c, i) => {
    const st = S ? S.st[i] : 0;
    if (S) c.face.textContent = SYMBOLS[S.sym[i]];
    c.el.classList.toggle("flipped", st === 1);
    c.el.classList.toggle("matched", st === 2);
    c.el.classList.toggle("by1", st === 2 && S.own[i] === 1);
    c.el.classList.toggle("by2", st === 2 && S.own[i] === 2);
    c.el.classList.toggle("focused", canPlay() && i === cursor && st !== 2);
    c.el.classList.toggle("opp-focused", showOpp && i === oppCur && st !== 2);
  });
  renderStatus();
}

function renderStatus() {
  const over = !!S && S.status !== "playing";
  const found = S ? S.pairs[1] + S.pairs[2] : 0;
  $("pairs-count").textContent = T.pairs(found, PAIRS);
  $("versus").innerHTML = S ? `${T.you} <b style="color:var(--me)">${S.pairs[me]}</b> – <b style="color:var(--opp)">${S.pairs[3 - me]}</b> ${T.opp}` : "";
  $("score").textContent = S && (S.score[1] + S.score[2] > 0) ? T.games.replace("{me}", S.score[me]).replace("{opp}", S.score[3 - me]) : "";
  $("me-text").textContent = me === 1 ? T.playBlue : T.playOrange;
  $("hint").textContent = TOUCH ? (over ? "" : T.hintTouch) : (over ? "" : T.hint);
  if (peerLeft)          setStatus(T.oppLeft, "lose");
  else if (!linked)      setStatus(everLinked ? T.lost : (me === 1 ? T.waitOpp : T.connecting), "waiting");
  else if (!S)           setStatus(T.connecting, "waiting");
  else if (S.status === "playing") {
    if (S.busy) { const a = S.sym[S.up[0]] === S.sym[S.up[1]]; setStatus(a ? T.matched : T.noMatch, a ? "matched" : "no-match"); }
    else if (S.turn !== me) setStatus(T.oppTurn, "waiting");
    else setStatus(T.yourTurn, "your-turn");
  } else if (!showAgain) {
    setStatus(S.status === "draw" ? T.draw : (S.winner === me ? T.youWin : T.youLose), S.status === "draw" ? "idle" : (S.winner === me ? "win" : "lose"));
  } else {
    setStatus(S.rematch[me] ? T.waitAgain : S.rematch[3 - me] ? T.oppAgain : T.pressAgain, "idle");
  }
}

// ── Live cursor ────────────────────────────────────────────────────────────
function sendFocus(force) {
  if (!myTurn()) return;
  clearTimeout(focusTimer);
  const wait = force ? 0 : 60 - (Date.now() - lastFocusSent);
  if (wait > 0) { focusTimer = setTimeout(() => sendFocus(true), wait); return; }
  lastFocusSent = Date.now();
  sess.send("focus", { cur: cursor });
}

// ── State changes: BOTH sides funnel through adopt() ───────────────────────
function adopt(next) {
  const prev = S;
  S = next;
  if (pending && !(prev && prev.epoch === next.epoch && next.rev <= pendingRev)) pending = false;
  armed = null; oppCur = null;
  const finished = next.status !== "playing" && (!prev || prev.status === "playing");
  if (!(prev && prev.status !== "playing" && next.status !== "playing")) {                 // (a rematch request during the result keeps the timer running)
    showAgain = false; clearTimeout(againTimer);
    if (next.status !== "playing") againTimer = setTimeout(() => { showAgain = true; render(); }, 2200);
  }
  render();
  setTimeout(() => {                                             // sounds after drawing / publishing
    if (prev && next.up.length > prev.up.length) playFlip();
    if (prev && !prev.busy && next.busy) (next.sym[next.up[0]] === next.sym[next.up[1]] ? playMatch : playNoMatch)();
    if (finished) next.status === "draw" ? playDraw() : next.winner === me ? playWin() : playLose();
  }, 0);
  if (myTurn()) sendFocus(true);
}

// ── HOST: applies the rules ────────────────────────────────────────────────
function hostCommit(next) {
  next.epoch = EPOCH;
  next.rev = (S && S.rev || 0) + 1;
  sess.publishSnapshot(next);                    // FIRST: nothing local may delay the guest's update
  adopt(next);
}
function hostResync() { S.rev = (S.rev || 0) + 1; sess.publishSnapshot(S); }

function hostFlip(piece, i, ply) {
  if (!S || S.status !== "playing" || S.turn !== piece || S.busy) return false;
  if (!Number.isInteger(i) || i < 0 || i >= CARDS || S.st[i] !== 0) return false;
  if (ply !== undefined && ply !== S.ply) return false;                 // a stale / duplicate intent
  const next = clone(S);
  next.st[i] = 1; next.up.push(i); next.ply += 1;
  if (next.up.length === 2) {
    next.busy = true;
    const match = next.sym[next.up[0]] === next.sym[next.up[1]];
    const round = next.epoch + ":" + next.starter + ":" + (next.score[1] + next.score[2]);
    clearTimeout(resolveTimer);
    resolveTimer = setTimeout(() => hostResolve(round), match ? RESOLVE_MATCH_MS : RESOLVE_MISS_MS);
  }
  hostCommit(next);
  return true;
}
// two cards are face up: turn them into a pair (and let the same player continue) or back down (and pass the turn)
function hostResolve(round) {
  if (!S || !S.busy || S.status !== "playing") return;
  if (round !== S.epoch + ":" + S.starter + ":" + (S.score[1] + S.score[2])) return;    // a timer left over from a previous round
  const next = clone(S), [a, b] = next.up;
  if (next.sym[a] === next.sym[b]) {
    next.st[a] = next.st[b] = 2; next.own[a] = next.own[b] = next.turn; next.pairs[next.turn] += 1;
    if (next.pairs[1] + next.pairs[2] === PAIRS) {
      if (next.pairs[1] === next.pairs[2]) next.status = "draw";
      else { next.status = "won"; next.winner = next.pairs[1] > next.pairs[2] ? 1 : 2; next.score[next.winner] += 1; }
    }
  } else {
    next.st[a] = next.st[b] = 0; next.turn = 3 - next.turn;
  }
  next.up = []; next.busy = false; next.ply += 1;
  hostCommit(next);
}
function hostRematch(piece) {
  if (!S || S.status === "playing") return;
  const next = clone(S);
  next.rematch[piece] = true;
  if (next.rematch[1] && next.rematch[2]) { clearTimeout(resolveTimer); hostCommit(newRound(3 - S.starter, next.score)); }
  else hostCommit(next);
}

// ── Local input ────────────────────────────────────────────────────────────
function activate(i) {                                                   // Enter / A / the second tap
  if (!canPlay() || !S || S.st[i] !== 0) return;
  armed = null;
  if (me === 1) { hostFlip(1, i); return; }
  pending = true; pendingRev = S.rev;
  const token = ++pendingToken;
  sess.send("move", { flip: i, ply: S.ply });                            // an INTENT naming the state it is based on
  setTimeout(() => { if (pending && token === pendingToken) { pending = false; sess.send("sync"); render(); } }, 4000);
  render();
}
function moveCursor(dx, dy) {
  const c = Math.max(0, Math.min(COLS - 1, (cursor % COLS) + dx)), r = Math.max(0, Math.min(ROWS - 1, Math.floor(cursor / COLS) + dy));
  cursor = r * COLS + c; armed = null; render(); sendFocus();
}
function requestRematch() {
  if (!S || S.status === "playing" || peerLeft || !linked || S.rematch[me]) return;
  me === 1 ? hostRematch(1) : sess.send("rematch");
}

document.addEventListener("keydown", (e) => {
  unlockAudio();
  if (e.key === "Escape") { sess.leave(); return; }
  if (S && S.status !== "playing") { if (!["Shift", "Control", "Alt", "Meta"].includes(e.key)) requestRematch(); return; }
  if (e.key === "ArrowLeft")  { e.preventDefault(); moveCursor(-1, 0); }
  if (e.key === "ArrowRight") { e.preventDefault(); moveCursor(1, 0); }
  if (e.key === "ArrowUp")    { e.preventDefault(); moveCursor(0, -1); }
  if (e.key === "ArrowDown")  { e.preventDefault(); moveCursor(0, 1); }
  if (e.key === "Enter" || e.key === " ") activate(cursor);
});
document.addEventListener("pointerdown", unlockAudio);

let gpPrev = [];                                                         // gamepad (standard mapping)
function pollGamepad() {
  const gp = navigator.getGamepads?.()[0];
  if (gp) {
    const hit = (i) => gp.buttons[i]?.pressed && !gpPrev[i];
    if (S && S.status !== "playing") { if (hit(9)) sess.leave(); else if ([0, 1, 2, 3, 12, 13, 14, 15].some(hit)) requestRematch(); }
    else {
      if (hit(14) || (gp.axes[0] < -.5 && !gpPrev.axL)) moveCursor(-1, 0);
      if (hit(15) || (gp.axes[0] >  .5 && !gpPrev.axR)) moveCursor(1, 0);
      if (hit(12) || (gp.axes[1] < -.5 && !gpPrev.axU)) moveCursor(0, -1);
      if (hit(13) || (gp.axes[1] >  .5 && !gpPrev.axD)) moveCursor(0, 1);
      if (hit(0)) activate(cursor);
      if (hit(1) || hit(9)) sess.leave();
    }
    gpPrev = gp.buttons.map((b) => b.pressed);
    gpPrev.axL = gp.axes[0] < -.5; gpPrev.axR = gp.axes[0] > .5; gpPrev.axU = gp.axes[1] < -.5; gpPrev.axD = gp.axes[1] > .5;
  }
  requestAnimationFrame(pollGamepad);
}
requestAnimationFrame(pollGamepad);

// ── The online session ─────────────────────────────────────────────────────
sess = EldaOnline.connect({
  getSnapshot: () => S,

  onSnapshot: (snap) => {
    if (!validSnapshot(snap)) return;
    if (S && snap.rev !== undefined && snap.epoch === S.epoch && snap.rev === S.rev) return;   // a repeat
    adopt(snap);
  },

  onMessage: (type, payload) => {
    if (type === "focus") {
      const c = payload && payload.cur;
      if (Number.isInteger(c) && c >= 0 && c < CARDS) { oppCur = c; render(); }
      return;
    }
    if (me !== 1) return;                                                // only the host applies rules
    let ok = true;
    if (type === "move")    ok = hostFlip(2, payload && payload.flip, payload && payload.ply);
    if (type === "rematch") hostRematch(2);
    if (type === "sync" || !ok) hostResync();
  },

  onLink: (status) => {
    linked = status === "up";
    if (linked) everLinked = true; else oppCur = null;
    render();
    if (linked) sendFocus(true);
  },
  onPeerJoined: () => sendFocus(true),
  onPeerLeft: () => { peerLeft = true; clearTimeout(resolveTimer); render(); },
});

me = sess.role === "host" ? 1 : 2;
document.documentElement.style.setProperty("--me",  me === 1 ? "var(--p1)" : "var(--p2)");
document.documentElement.style.setProperty("--opp", me === 1 ? "var(--p2)" : "var(--p1)");
if (me === 1) S = newRound(1);     // the host goes first in round 1; the guest waits for a snapshot
render();

// ── Test-bench hooks (see online/DEVELOPING.md R33–R35) ────────────────────
window.eldaDebugState = () => S;
window.eldaDebugInvariant = (s) => {
  const count = {}; let matched = 0;
  for (let i = 0; i < CARDS; i++) { count[s.sym[i]] = (count[s.sym[i]] || 0) + 1; if (s.st[i] === 2) { matched++; if (s.own[i] !== 1 && s.own[i] !== 2) return "a matched card without an owner"; } }
  if (Object.values(count).some((n) => n !== 2) || Object.keys(count).length !== PAIRS) return "the symbols are not " + PAIRS + " exact pairs";
  if (s.up.length !== s.st.filter((v) => v === 1).length) return "the face-up list does not match the cards showing";
  if (s.up.length > 2) return "more than two cards face up";
  if (s.busy && s.up.length !== 2) return "busy without two cards face up";
  if (matched !== 2 * (s.pairs[1] + s.pairs[2])) return "matched cards and pairs found disagree";
  return null;
};
window.eldaDebugRandomInput = () => {
  if (S && S.status !== "playing") { requestRematch(); return; }
  if (!canPlay()) return;
  const down = []; for (let i = 0; i < CARDS; i++) if (S.st[i] === 0) down.push(i);
  if (!down.length) return;
  const i = down[Math.floor(Math.random() * down.length)];
  cursor = i; activate(i);
};
</script>

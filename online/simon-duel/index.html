<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
<title>Simon duel — online</title>
<!-- Look & feel: identical to the single-player Simon (../../simon/index.html). Only what two players need is added
     (scores of both players, the opponent's live presses, a phone layout). -->
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: #0e0e1c;
    color: #e0e0e0;
    font-family: 'Segoe UI', Arial, sans-serif;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; user-select: none; -webkit-user-select: none; touch-action: manipulation;
  }
  #game {
    display: flex; flex-direction: column;
    align-items: center; gap: 0.9rem;
    padding: 0.5rem;
  }
  /* TV (landscape) only: leaves the top-right corner clear for the call thumbnail (DEVELOPING.md R36) —
     already true today by being centered and compact; this just makes sure a future change can't grow
     into it unnoticed. The phone never shows that thumbnail, so it keeps the full width. */
  @media (min-aspect-ratio: 1/1) {
    #game { max-width: 78vw; }
  }
  #scoreboard {
    display: flex; gap: 2.5rem;
    font-size: 1.4rem; color: #666;
  }
  #scoreboard span b { color: #ddd; font-size: 1.8rem; }
  #status {
    font-size: 2.2rem; font-weight: 700; min-height: 2.7rem;
    text-align: center; letter-spacing: .02em;
  }
  #status.watching  { color: #ddaa00; }
  #status.your-turn { color: #22bb33; }
  #status.wrong     { color: #dd2200; }
  #status.idle      { color: #555; }

  /* The SVG pad — fills up to 62% of the smaller viewport dimension */
  #pad {
    width:  min(62vh, 62vw);
    height: min(62vh, 62vw);
    display: block;
  }
  .seg { cursor: pointer; }

  #progress { display: flex; gap: .5rem; min-height: 12px; }
  .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: #333; transition: background .15s;
  }
  .dot.done  { background: #22bb33; }
  .dot.wrong { background: #dd2200; }
  #hint {
    font-size: 0.95rem; color: #555; text-align: center;
    line-height: 1.7; white-space: pre; min-height: 3rem;
  }

  @media (max-aspect-ratio: 1/1) {                       /* phone in portrait: the same, sized for the width */
    #pad { width: min(60vh, 88vw); height: min(60vh, 88vw); }
    #scoreboard { gap: 1.2rem; font-size: 1.05rem; }
    #scoreboard span b { font-size: 1.4rem; }
    #status { font-size: 1.3rem; min-height: 1.8rem; }
    #hint { font-size: .8rem; min-height: 2.2rem; }
  }
</style>
</head>
<body>
<div id="game">
  <div id="scoreboard">
    <span id="lbl-level"></span>
    <span id="lbl-you"></span>
    <span id="lbl-opp"></span>
  </div>
  <div id="status" class="idle"></div>

  <!-- Circular Simon pad — the same SVG as the single-player game (viewBox 400×400, centre (200,200)).
       idx=0 Top ↑ Red   idx=1 Right → Green   idx=2 Bottom ↓ Blue   idx=3 Left ← Yellow -->
  <svg id="pad" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
    <circle cx="200" cy="200" r="198" fill="#0a0a0a"/>
    <circle cx="200" cy="200" r="193" fill="#131313"/>

    <path id="seg-0" class="seg" data-idx="0" d="M 200 200 L 82.2 69.2 A 176 176 0 0 1 317.8 69.2 Z" fill="#cc1100"/>
    <path id="seg-1" class="seg" data-idx="1" d="M 200 200 L 330.8 82.2 A 176 176 0 0 1 330.8 317.8 Z" fill="#009922"/>
    <path id="seg-2" class="seg" data-idx="2" d="M 200 200 L 317.8 330.8 A 176 176 0 0 1 82.2 330.8 Z" fill="#1155cc"/>
    <path id="seg-3" class="seg" data-idx="3" d="M 200 200 L 69.2 317.8 A 176 176 0 0 1 69.2 82.2 Z" fill="#cc9900"/>

    <circle cx="200" cy="200" r="64" fill="#1e1e1e" pointer-events="none"/>
    <circle cx="200" cy="200" r="58" fill="#111111" pointer-events="none"/>
    <rect x="191" y="147" width="18" height="11" rx="5" fill="#242424" stroke="#333" stroke-width="1" pointer-events="none"/>
    <rect x="196" y="150" width="8" height="5" rx="2" fill="#4a4a4a" pointer-events="none"/>
    <text x="200" y="197" text-anchor="middle" dominant-baseline="middle" fill="white"
          font-size="27" font-weight="900" letter-spacing="-1"
          font-family="'Arial Black', 'Impact', Arial, sans-serif" pointer-events="none">simon</text>
    <g pointer-events="none" fill="#1f1f1f">
      <circle cx="183" cy="214" r="2.4"/> <circle cx="191" cy="214" r="2.4"/> <circle cx="199" cy="214" r="2.4"/> <circle cx="207" cy="214" r="2.4"/> <circle cx="215" cy="214" r="2.4"/>
      <circle cx="183" cy="222" r="2.4"/> <circle cx="191" cy="222" r="2.4"/> <circle cx="199" cy="222" r="2.4"/> <circle cx="207" cy="222" r="2.4"/> <circle cx="215" cy="222" r="2.4"/>
      <circle cx="187" cy="230" r="2.4"/> <circle cx="195" cy="230" r="2.4"/> <circle cx="203" cy="230" r="2.4"/> <circle cx="211" cy="230" r="2.4"/>
    </g>
    <text x="200" y="44"  text-anchor="middle" fill="rgba(255,255,255,0.28)" font-size="15" pointer-events="none">↑</text>
    <text x="357" y="205" text-anchor="middle" fill="rgba(255,255,255,0.28)" font-size="15" pointer-events="none">→</text>
    <text x="200" y="370" text-anchor="middle" fill="rgba(255,255,255,0.28)" font-size="15" pointer-events="none">↓</text>
    <text x="43"  y="205" text-anchor="middle" fill="rgba(255,255,255,0.28)" font-size="15" pointer-events="none">←</text>
  </svg>

  <div id="progress"></div>
  <div id="hint"></div>
</div>

<script src="../elda-online.js"></script>
<script>
// ── i18n (en / fr / nl) — the single-player wording where it exists. No text-to-speech: online games run during a video call. ──
const PARAMS = new URLSearchParams(location.search);
const LANG = (() => {
  const l = (PARAMS.get("lang") || "en").split(/[-_]/)[0].toLowerCase();
  return ["fr", "nl"].includes(l) ? l : "en";
})();
const T = {
  en: { level: "Level", you: "You", opp: "Opponent", watch: "Watch carefully!", yourTurn: "Your turn!", first: "You start — pick any colour",
        add: "Now add ONE more colour!", oppTurn: "Opponent's turn", wrong: "Wrong! ✗", youWin: "You win! 🎉",
        pressAgain: "Press any key or button to play again", waitAgain: "Waiting for your opponent…", oppAgain: "Your opponent wants a rematch — press any key or button",
        waitOpp: "Waiting for your opponent…", connecting: "Connecting…", lost: "Connection lost — waiting…", oppLeft: "Your opponent left the game", sent: "…",
        keyHint: "↑ Red   → Green   ↓ Blue   ← Yellow" },
  fr: { level: "Niveau", you: "Vous", opp: "Adversaire", watch: "Regardez bien !", yourTurn: "À vous !", first: "Vous commencez — choisissez une couleur",
        add: "Ajoutez maintenant UNE couleur !", oppTurn: "Tour de l'adversaire", wrong: "Faux ! ✗", youWin: "Vous gagnez ! 🎉",
        pressAgain: "Appuyez sur une touche ou un bouton pour rejouer", waitAgain: "En attente de votre adversaire…", oppAgain: "Votre adversaire veut rejouer — appuyez sur une touche",
        waitOpp: "En attente de votre adversaire…", connecting: "Connexion…", lost: "Connexion perdue — en attente…", oppLeft: "Votre adversaire a quitté la partie", sent: "…",
        keyHint: "↑ Rouge   → Vert   ↓ Bleu   ← Jaune" },
  nl: { level: "Niveau", you: "U", opp: "Tegenstander", watch: "Kijk goed!", yourTurn: "Uw beurt!", first: "U begint — kies een kleur",
        add: "Voeg nu ÉÉN kleur toe!", oppTurn: "Beurt van de tegenstander", wrong: "Fout! ✗", youWin: "U wint! 🎉",
        pressAgain: "Druk een toets of knop in om opnieuw te spelen", waitAgain: "Wachten op uw tegenstander…", oppAgain: "Uw tegenstander wil opnieuw spelen — druk een toets in",
        waitOpp: "Wachten op uw tegenstander…", connecting: "Verbinden…", lost: "Verbinding verbroken — wachten…", oppLeft: "Uw tegenstander heeft het spel verlaten", sent: "…",
        keyHint: "↑ Rood   → Groen   ↓ Blauw   ← Geel" },
}[LANG];

// ── Segment colours (dim / lit / glow) — as in the single-player game ─────
// idx: 0=Red(↑)  1=Green(→)  2=Blue(↓)  3=Yellow(←)
const SEG = [
  { dim: "#cc1100", lit: "#ff4422", glow: "#ff4422" },
  { dim: "#009922", lit: "#33ee55", glow: "#33ee55" },
  { dim: "#1155cc", lit: "#3399ff", glow: "#3399ff" },
  { dim: "#cc9900", lit: "#ffdd33", glow: "#ffdd33" },
];

// ── Audio: the same classic Simon tones as the single-player game (sound effects only) ──
const TONES = [196, 330, 262, 392];
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
function playTone(idx, duration = 350) {
  try {
    const ctx = getAudioCtx(), osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.type = "sine"; osc.frequency.value = TONES[idx];
    gain.gain.setValueAtTime(0.55, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration / 1000);
    osc.start(); osc.stop(ctx.currentTime + duration / 1000);
  } catch (_) {}
}
function playWrongSound() {
  try {
    const ctx = getAudioCtx(), osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.type = "sawtooth"; osc.frequency.value = 120;
    gain.gain.setValueAtTime(0.4, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.7);
    osc.start(); osc.stop(ctx.currentTime + 0.7);
  } catch (_) {}
}
function playWinSound() { [[523, 0], [659, .14], [784, .28], [1046, .42]].forEach(([f, d]) => setTimeout(() => playTone(0, 1), d * 1000)); }
const unlockAudio = () => { if (audioCtx && audioCtx.state === "suspended") audioCtx.resume(); };

// ── The rules ──────────────────────────────────────────────────────────────
//  A shared sequence of colours. On your turn you repeat the WHOLE sequence, then add ONE new colour.
//  The first wrong press loses. Colours: 0 Red ↑, 1 Green →, 2 Blue ↓, 3 Yellow ←.
//  The whole turn travels as ONE intent {pads, ply}: the phone plays with instant feedback, whatever the network does.
const EPOCH = Math.random().toString(36).slice(2, 10);
function newRound(starter, score) {
  return { seq: [], turn: starter, starter, status: "playing", winner: 0, ply: 0, fail: null,
           score: score || { 1: 0, 2: 0 }, rematch: { 1: false, 2: false }, epoch: EPOCH, rev: 0 };
}
function validSnapshot(s) {
  return !!s && Array.isArray(s.seq) && s.seq.length <= 500 && s.seq.every((p) => Number.isInteger(p) && p >= 0 && p <= 3)
    && (s.turn === 1 || s.turn === 2) && ["playing", "won"].includes(s.status) && Number.isInteger(s.ply)
    && (s.fail === null || (s.fail && Number.isInteger(s.fail.expected))) && s.score && s.rematch;
}
const clone = (o) => JSON.parse(JSON.stringify(o));
// pacing, exactly as in the single-player game
const stepMs = (level) => Math.max(200, 500 - level * 12);
const gapMs  = (level) => Math.max(100, stepMs(level) * 0.4);

let S = null, sess = null, me = 1;
let phase = "idle";              // "watch" (the sequence plays) | "ready" (played: on my turn I may press, on theirs I watch live) | "sent" | "over"
let entered = [];                // my presses this turn
let oppN = 0;                    // how many pads the opponent has pressed this turn (live)
let playToken = 0;
let showAgain = false, againTimer = null;   // like the single-player game: the result first, then "press any key to play again"
let linked = false, everLinked = false, peerLeft = false;
let pending = false, pendingRev = null, pendingToken = 0;

const myTurn = () => !!S && linked && !peerLeft && S.status === "playing" && S.turn === me;
const canAct = () => myTurn() && !pending && phase === "ready";

// ── DOM ────────────────────────────────────────────────────────────────────
const $ = (id) => document.getElementById(id);
$("hint").textContent = T.keyHint;
[0, 1, 2, 3].forEach((i) => $("seg-" + i).addEventListener("click", () => input(i)));

function setStatus(text, cls) { $("status").textContent = text; $("status").className = cls; }
const litTok = [0, 0, 0, 0];             // a newer light on a pad cancels the "off" timer of an older one
function setLit(idx, on) {
  litTok[idx]++;
  const el = $("seg-" + idx);
  if (on) { el.setAttribute("fill", SEG[idx].lit); el.style.filter = `brightness(1.55) drop-shadow(0 0 18px ${SEG[idx].glow})`; }
  else    { el.setAttribute("fill", SEG[idx].dim); el.style.filter = ""; }
}
function flash(idx, duration = 350, silent) {
  setLit(idx, true);
  const tok = litTok[idx];
  if (!silent) playTone(idx, duration);
  setTimeout(() => { if (litTok[idx] === tok) setLit(idx, false); }, duration);
}
function renderProgress() {
  const box = $("progress"); box.innerHTML = "";
  const done = myTurn() ? entered.length : (S && S.turn !== me ? oppN : 0);
  (S ? S.seq : []).forEach((_, i) => {
    const dot = document.createElement("div");
    dot.className = "dot" + (i < done ? " done" : "");
    box.appendChild(dot);
  });
}
function renderScoreboard() {
  $("lbl-level").innerHTML = `${T.level}: <b>${S ? Math.max(1, S.seq.length) : 0}</b>`;
  $("lbl-you").innerHTML   = `${T.you}: <b>${S ? S.score[me] : 0}</b>`;
  $("lbl-opp").innerHTML   = `${T.opp}: <b>${S ? S.score[3 - me] : 0}</b>`;
}

function render() {
  renderScoreboard(); renderProgress();
  if (peerLeft)        setStatus(T.oppLeft, "wrong");
  else if (!linked)    setStatus(everLinked ? T.lost : (me === 1 ? T.waitOpp : T.connecting), "watching");
  else if (!S)         setStatus(T.connecting, "watching");
  else if (S.status === "playing") {
    if (phase === "watch") setStatus(T.watch, "watching");
    else if (S.turn !== me) setStatus(T.oppTurn, "watching");
    else if (pending || phase === "sent") setStatus(T.sent, "watching");
    else if (S.seq.length === 0) setStatus(T.first, "your-turn");
    else setStatus(entered.length >= S.seq.length ? T.add : T.yourTurn, "your-turn");
  } else if (!showAgain) {
    setStatus(S.winner === me ? T.youWin : T.wrong, S.winner === me ? "your-turn" : "wrong");
  } else {
    setStatus(S.rematch[me] ? T.waitAgain : S.rematch[3 - me] ? T.oppAgain : T.pressAgain, "idle");
  }
}

// ── Playback: BOTH screens play the sequence at the start of a turn ────────
function startPlayback() {
  const token = ++playToken, seq = S.seq.slice(), level = seq.length, step = stepMs(level), gap = gapMs(level);
  phase = "watch"; entered = []; oppN = 0; render();
  let i = 0;
  const next = () => {                                    // (a timer chain rather than async/await: the test harness drives a virtual clock)
    if (token !== playToken) return;
    if (i >= seq.length) { finishPlayback(token); return; }   // the turn starts once the last colour has flashed
    flash(seq[i++], step);
    setTimeout(next, i < seq.length ? step + gap : step);   // no gap after the last one: the turn starts right away
  };
  setTimeout(next, 400);
}
function finishPlayback(token) {
  if (token !== undefined && token !== playToken) return;
  playToken++;
  phase = S && S.status === "playing" ? "ready" : "over";      // (whose turn it is decides, later, through canAct)
  entered = []; render();
}

// ── State changes: BOTH sides funnel through adopt() ───────────────────────
function adopt(next) {
  const prev = S;
  S = next;
  if (pending && !(prev && prev.epoch === next.epoch && next.rev <= pendingRev)) pending = false;
  const sameTurn = prev && prev.epoch === next.epoch && prev.ply === next.ply && prev.turn === next.turn && prev.status === next.status;
  if (sameTurn) {                                                        // a repeat / resync: don't restart what is in progress
    if (phase === "sent" && !pending) { phase = "ready"; entered = []; }  // ...but a turn the host refused is released
    render(); return;
  }
  showAgain = false; clearTimeout(againTimer);
  if (next.status === "playing") startPlayback();
  else {                                                                  // game over: as in the single-player game — a wrong sound, all four flash, then "press any key"
    playToken++; phase = "over"; entered = []; render();
    setTimeout(() => { if (next.winner === me) playWinSound(); else playWrongSound(); }, 0);
    setTimeout(() => [0, 1, 2, 3].forEach((i) => flash(i, 600, true)), 150);
    againTimer = setTimeout(() => { showAgain = true; render(); }, 1800);
  }
}

// ── HOST: applies the rules ────────────────────────────────────────────────
function hostCommit(next) {
  next.epoch = EPOCH;
  next.rev = (S && S.rev || 0) + 1;
  sess.publishSnapshot(next);                    // FIRST: nothing local may delay the guest's update
  adopt(next);
}
function hostResync() { S.rev = (S.rev || 0) + 1; sess.publishSnapshot(S); }

// a whole turn: the player's presses. Right = the sequence replayed exactly, plus ONE new colour.
function hostTurn(piece, pads, ply) {
  if (!S || S.status !== "playing" || S.turn !== piece) return false;
  if (ply !== undefined && ply !== S.ply) return false;                  // a stale / duplicate intent
  if (!Array.isArray(pads) || pads.length < 1 || pads.length > S.seq.length + 1 || !pads.every((p) => Number.isInteger(p) && p >= 0 && p <= 3)) return false;
  let k = 0; while (k < pads.length && k < S.seq.length && pads[k] === S.seq[k]) k++;
  const next = clone(S);
  if (k < pads.length && k < S.seq.length) {                             // the first wrong press: the game is over
    next.status = "won"; next.winner = 3 - piece; next.score[next.winner] += 1;
    next.fail = { by: piece, at: k, expected: S.seq[k], got: pads[k] };
    next.ply += 1;
  } else if (pads.length === S.seq.length + 1) {                          // repeated it all and added one
    next.seq = pads.slice(); next.turn = 3 - piece; next.ply += 1;
  } else return false;                                                    // not finished (or a lie): refuse
  hostCommit(next);
  return true;
}
function hostRematch(piece) {
  if (!S || S.status === "playing") return;
  const next = clone(S);
  next.rematch[piece] = true;
  hostCommit(next.rematch[1] && next.rematch[2] ? newRound(3 - S.starter, next.score) : next);
}

// ── Local input ────────────────────────────────────────────────────────────
function input(p) {
  unlockAudio();
  if (S && S.status !== "playing") { requestRematch(); return; }          // any colour / key / button after the game: play again
  if (!canAct()) return;
  flash(p, 250);
  if (linked) sess.send("focus", { pad: p, n: entered.length });          // the opponent watches my presses live
  const k = entered.length;
  entered.push(p);
  const mistake = k < S.seq.length && p !== S.seq[k];
  if (mistake || entered.length === S.seq.length + 1) submit(); else render();
}
function submit() {
  const pads = entered.slice(); phase = "sent"; render();
  if (me === 1) { if (!hostTurn(1, pads)) { phase = "ready"; entered = []; render(); } return; }
  pending = true; pendingRev = S.rev;
  const token = ++pendingToken;
  sess.send("move", { pads, ply: S.ply });                               // ONE intent for the whole turn, naming the state it is based on
  setTimeout(() => { if (pending && token === pendingToken) { pending = false; phase = "ready"; entered = []; sess.send("sync"); render(); } }, 4000);
}
function requestRematch() {
  if (!S || S.status === "playing" || peerLeft || !linked || S.rematch[me]) return;
  me === 1 ? hostRematch(1) : sess.send("rematch");
}

// Keyboard — as in the single-player game: Up=Red Right=Green Down=Blue Left=Yellow (WASD too)
const KEY_MAP = { ArrowUp: 0, w: 0, W: 0, ArrowRight: 1, d: 1, D: 1, ArrowDown: 2, s: 2, S: 2, ArrowLeft: 3, a: 3, A: 3 };
document.addEventListener("keydown", (e) => {
  unlockAudio();
  if (e.key === "Escape") { sess.leave(); return; }
  if (S && S.status !== "playing") { if (!["Shift", "Control", "Alt", "Meta"].includes(e.key)) requestRematch(); return; }
  if (KEY_MAP[e.key] !== undefined) { e.preventDefault(); input(KEY_MAP[e.key]); }
});
document.addEventListener("pointerdown", unlockAudio);

// Gamepad — as in the single-player game: A/B/X/Y = the four colours, and so is the d-pad; Start quits
const GP_MAP = { 0: 0, 1: 1, 2: 2, 3: 3, 12: 0, 15: 1, 13: 2, 14: 3 };
let gpPrev = {};
// The d-pad as buttons 12-15 (standard mapping) — or, on many Bluetooth gamepads (8BitDo in D-input mode, …),
// as the first stick's axes: both count, like in the other games
function gpPressed(gp, btn) {
  if (gp.buttons[btn]?.pressed) return true;
  const ax = gp.axes || [];
  if (btn === 12) return ax[1] < -0.5;   // up
  if (btn === 13) return ax[1] >  0.5;   // down
  if (btn === 14) return ax[0] < -0.5;   // left
  if (btn === 15) return ax[0] >  0.5;   // right
  return false;
}
function pollGamepad() {
  const gp = navigator.getGamepads?.()[0];
  if (gp) {
    for (const [btn, idx] of Object.entries(GP_MAP)) {
      const pressed = gpPressed(gp, +btn);
      if (pressed && !gpPrev[btn]) input(idx);
      gpPrev[btn] = pressed;
    }
    if (gp.buttons[9]?.pressed && !gpPrev[9]) sess.leave();
    gpPrev[9] = gp.buttons[9]?.pressed;
  }
  requestAnimationFrame(pollGamepad);
}
requestAnimationFrame(pollGamepad);

// ── The online session ─────────────────────────────────────────────────────
sess = EldaOnline.connect({
  getSnapshot: () => S,

  onSnapshot: (snap) => {
    if (!validSnapshot(snap)) return;
    if (S && snap.rev !== undefined && snap.epoch === S.epoch && snap.rev === S.rev) return;   // a repeat
    adopt(snap);
  },

  onMessage: (type, payload) => {
    if (type === "focus") {                                              // the opponent's press, live
      const p = payload && payload.pad;
      if (S && S.status === "playing" && S.turn !== me && phase === "ready" && Number.isInteger(p) && p >= 0 && p <= 3) { oppN++; flash(p, 250); render(); }
      return;
    }
    if (me !== 1) return;                                                // only the host applies rules
    let ok = true;
    if (type === "move")    ok = hostTurn(2, payload && payload.pads, payload && payload.ply);
    if (type === "rematch") hostRematch(2);
    if (type === "sync" || !ok) hostResync();
  },

  onLink: (status) => {
    linked = status === "up";
    if (linked) everLinked = true;
    render();
  },
  onPeerLeft: () => { peerLeft = true; playToken++; render(); },
});

me = sess.role === "host" ? 1 : 2;
if (me === 1) { S = newRound(1); startPlayback(); }    // the host starts; the guest waits for a snapshot
render();

// ── Test-bench hooks (see online/DEVELOPING.md R33–R35) ────────────────────
window.eldaDebugState = () => S;
window.eldaDebugInvariant = (s) => {
  if (s.seq.some((p) => !(p >= 0 && p <= 3))) return "a colour outside 0..3 in the sequence";
  if (s.status === "won" && !s.fail && s.winner === 0) return "won without a winner";
  if (s.status === "playing" && s.fail) return "a failure on a game still playing";
  if (s.fail && s.fail.by !== 3 - s.winner) return "the winner is the player who failed";
  return null;
};
// one random meaningful input: play a whole turn correctly (almost always), or make a mistake now and then
window.eldaDebugRandomInput = () => {
  if (S && S.status !== "playing") { requestRematch(); return; }
  if (phase === "watch" && myTurn()) finishPlayback();                   // skip the animation
  if (!canAct()) return;
  const mistake = Math.random() < 0.06 && S.seq.length > 0;
  for (const p of S.seq) { input(mistake && Math.random() < 0.3 ? (p + 1) % 4 : p); if (!canAct()) return; }
  if (canAct()) input(Math.floor(Math.random() * 4));
};
</script>

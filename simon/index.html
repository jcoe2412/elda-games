<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Simon</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: #0e0e1c;
    color: #e0e0e0;
    font-family: 'Segoe UI', Arial, sans-serif;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; user-select: none;
  }
  #game {
    display: flex; flex-direction: column;
    align-items: center; gap: 0.9rem;
    padding: 0.5rem;
  }
  #scoreboard {
    display: flex; gap: 2.5rem;
    font-size: 1.4rem; color: #666;
  }
  #scoreboard span b { color: #ddd; font-size: 1.8rem; }
  #status {
    font-size: 2.2rem; font-weight: 700; min-height: 2.7rem;
    text-align: center; letter-spacing: .02em;
  }
  #status.watching  { color: #ddaa00; }
  #status.your-turn { color: #22bb33; }
  #status.wrong     { color: #dd2200; }
  #status.idle      { color: #555; }

  /* The SVG pad — fills up to 62% of the smaller viewport dimension */
  #pad {
    width:  min(62vh, 62vw);
    height: min(62vh, 62vw);
    display: block;
  }
  .seg { cursor: pointer; }

  #progress { display: flex; gap: .5rem; min-height: 12px; }
  .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: #333; transition: background .15s;
  }
  .dot.done  { background: #22bb33; }
  .dot.wrong { background: #dd2200; }
  #hint {
    font-size: 0.95rem; color: #555; text-align: center;
    line-height: 1.7; white-space: pre; min-height: 3rem;
  }
</style>
</head>
<body>
<div id="game">
  <div id="scoreboard">
    <span id="lbl-level"></span>
    <span id="lbl-score"></span>
    <span id="lbl-best"></span>
  </div>
  <div id="status" class="idle"></div>

  <!--
    Circular Simon pad — viewBox 400×400, centre (200,200).

    Outer bezel : circle r=196 (black)
    Segments    : pie slices to r=176, 84° each, 6° gap (3° per side at 45°/135°/225°/315°)
    Centre hub  : circle r=62

    Segment–button mapping (matches gamepad d-pad & arrow keys):
      idx=0  Top    ↑   Red
      idx=1  Right  →   Green
      idx=2  Bottom ↓   Blue
      idx=3  Left   ←   Yellow

    Angles (from top, clockwise):
      Top   : −42° → 42°   → arc points (82.2, 69.2) → (317.8, 69.2)
      Right :  48° → 132°  → arc points (330.8, 82.2) → (330.8, 317.8)
      Bottom: 138° → 222°  → arc points (317.8, 330.8) → (82.2, 330.8)
      Left  : 228° → 312°  → arc points (69.2, 317.8) → (69.2, 82.2)
  -->
  <svg id="pad" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">

    <!-- Outer black bezel ring -->
    <circle cx="200" cy="200" r="198" fill="#0a0a0a"/>
    <!-- Subtle inner shadow ring for depth -->
    <circle cx="200" cy="200" r="193" fill="#131313"/>

    <!-- ── Coloured segments ───────────────────────────────── -->

    <!-- Top — Red (idx 0, ArrowUp / d-pad Up) -->
    <path id="seg-0" class="seg" data-idx="0"
      d="M 200 200 L 82.2 69.2 A 176 176 0 0 1 317.8 69.2 Z"
      fill="#cc1100"/>

    <!-- Right — Green (idx 1, ArrowRight / d-pad Right) -->
    <path id="seg-1" class="seg" data-idx="1"
      d="M 200 200 L 330.8 82.2 A 176 176 0 0 1 330.8 317.8 Z"
      fill="#009922"/>

    <!-- Bottom — Blue (idx 2, ArrowDown / d-pad Down) -->
    <path id="seg-2" class="seg" data-idx="2"
      d="M 200 200 L 317.8 330.8 A 176 176 0 0 1 82.2 330.8 Z"
      fill="#1155cc"/>

    <!-- Left — Yellow (idx 3, ArrowLeft / d-pad Left) -->
    <path id="seg-3" class="seg" data-idx="3"
      d="M 200 200 L 69.2 317.8 A 176 176 0 0 1 69.2 82.2 Z"
      fill="#cc9900"/>

    <!-- ── Centre hub ──────────────────────────────────────── -->
    <!-- Outer hub ring (slight rim) -->
    <circle cx="200" cy="200" r="64" fill="#1e1e1e" pointer-events="none"/>
    <!-- Hub face -->
    <circle cx="200" cy="200" r="58" fill="#111111" pointer-events="none"/>

    <!-- Power / status indicator (small pill button above text) -->
    <rect x="191" y="147" width="18" height="11" rx="5"
          fill="#242424" stroke="#333" stroke-width="1" pointer-events="none"/>
    <rect x="196" y="150" width="8" height="5" rx="2"
          fill="#4a4a4a" pointer-events="none"/>

    <!-- "simon" logotype -->
    <text x="200" y="197"
          text-anchor="middle" dominant-baseline="middle"
          fill="white"
          font-size="27" font-weight="900" letter-spacing="-1"
          font-family="'Arial Black', 'Impact', Arial, sans-serif"
          pointer-events="none">simon</text>

    <!-- Speaker grille — 3 rows of dots below text -->
    <g pointer-events="none" fill="#1f1f1f">
      <circle cx="183" cy="214" r="2.4"/> <circle cx="191" cy="214" r="2.4"/>
      <circle cx="199" cy="214" r="2.4"/> <circle cx="207" cy="214" r="2.4"/>
      <circle cx="215" cy="214" r="2.4"/>
      <circle cx="183" cy="222" r="2.4"/> <circle cx="191" cy="222" r="2.4"/>
      <circle cx="199" cy="222" r="2.4"/> <circle cx="207" cy="222" r="2.4"/>
      <circle cx="215" cy="222" r="2.4"/>
      <circle cx="187" cy="230" r="2.4"/> <circle cx="195" cy="230" r="2.4"/>
      <circle cx="203" cy="230" r="2.4"/> <circle cx="211" cy="230" r="2.4"/>
    </g>

    <!-- Subtle directional arrow hints at segment edges -->
    <text x="200" y="44"  text-anchor="middle" fill="rgba(255,255,255,0.28)" font-size="15" pointer-events="none">↑</text>
    <text x="357" y="205" text-anchor="middle" fill="rgba(255,255,255,0.28)" font-size="15" pointer-events="none">→</text>
    <text x="200" y="370" text-anchor="middle" fill="rgba(255,255,255,0.28)" font-size="15" pointer-events="none">↓</text>
    <text x="43"  y="205" text-anchor="middle" fill="rgba(255,255,255,0.28)" font-size="15" pointer-events="none">←</text>
  </svg>

  <div id="progress"></div>
  <div id="hint"></div>
</div>

<script>
// ── i18n ──────────────────────────────────────────────────────────────────
// URL param: ?lang=en (default), ?lang=fr, ?lang=nl
const LANG = (() => {
  const p = new URLSearchParams(location.search);
  const l = (p.get("lang") || "en").split(/[-_]/)[0].toLowerCase();
  return ["fr", "nl"].includes(l) ? l : "en";
})();

const T = {
  en: {
    level:      "Level",
    score:      "Score",
    best:       "Best",
    watch:      "Watch carefully!",
    yourTurn:   "Your turn!",
    wrong:      "Wrong! ✗",
    pressStart: "Press any key or button to start",
    pressAgain: "Press any key or button to play again",
    keyHint:    "↑ Red   → Green   ↓ Blue   ← Yellow",
  },
  fr: {
    level:      "Niveau",
    score:      "Score",
    best:       "Meilleur",
    watch:      "Regardez bien !",
    yourTurn:   "À vous !",
    wrong:      "Faux ! ✗",
    pressStart: "Appuyez sur n’importe quelle touche pour commencer",
    pressAgain: "Appuyez pour rejouer",
    keyHint:    "↑ Rouge   → Vert   ↓ Bleu   ← Jaune",
  },
  nl: {
    level:      "Niveau",
    score:      "Score",
    best:       "Best",
    watch:      "Kijk goed!",
    yourTurn:   "Uw beurt!",
    wrong:      "Fout! ✗",
    pressStart: "Druk een toets in om te beginnen",
    pressAgain: "Druk een toets in om opnieuw te spelen",
    keyHint:    "↑ Rood   → Groen   ↓ Blauw   ← Geel",
  },
}[LANG];

// ── Segment colours (dim / lit / glow) ────────────────────────────────────
// idx: 0=Red(↑)  1=Green(→)  2=Blue(↓)  3=Yellow(←)
const SEG = [
  { dim: "#cc1100", lit: "#ff4422", glow: "#ff4422" },
  { dim: "#009922", lit: "#33ee55", glow: "#33ee55" },
  { dim: "#1155cc", lit: "#3399ff", glow: "#3399ff" },
  { dim: "#cc9900", lit: "#ffdd33", glow: "#ffdd33" },
];

// ── Audio (Web Audio API) ──────────────────────────────────────────────────
// Classic Simon tones: red, green, blue, yellow
const TONES = [196, 330, 262, 392];
let audioCtx = null;

function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function playTone(idx, duration = 350) {
  try {
    const ctx  = getAudioCtx();
    const osc  = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.type = "sine";
    osc.frequency.value = TONES[idx];
    gain.gain.setValueAtTime(0.55, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration / 1000);
    osc.start(); osc.stop(ctx.currentTime + duration / 1000);
  } catch (_) {}
}

function playWrongSound() {
  try {
    const ctx  = getAudioCtx();
    const osc  = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.type = "sawtooth";
    osc.frequency.value = 120;
    gain.gain.setValueAtTime(0.4, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.7);
    osc.start(); osc.stop(ctx.currentTime + 0.7);
  } catch (_) {}
}

// ── Text-to-speech ────────────────────────────────────────────────────────
// ?voice=0  disables TTS and all voice-related pauses; default is enabled
const VOICE = new URLSearchParams(location.search).get("voice") !== "0";
const SPEECH_LANG = { en: "en-US", fr: "fr-FR", nl: "nl-NL" }[LANG];

// Verbose voice prompts — richer than the on-screen labels
const TV = {
  en: {
    watch:      "Watch carefully! Here comes the sequence.",
    yourTurn:   "Your turn!",
    wrong:      "Wrong! Game over.",
    pressAgain: "Press any key to play again.",
  },
  fr: {
    watch:      "Regardez bien ! Voici la séquence.",
    yourTurn:   "À vous de jouer !",
    wrong:      "Faux ! Partie terminée.",
    pressAgain: "Appuyez sur une touche pour rejouer.",
  },
  nl: {
    watch:      "Kijk goed! Hier komt de reeks.",
    yourTurn:   "Het is uw beurt!",
    wrong:      "Fout! Spel voorbij.",
    pressAgain: "Druk een toets in om opnieuw te spelen.",
  },
}[LANG];

let _voice    = null;
let _ttsReady = false;

function _pickVoice() {
  const vv = window.speechSynthesis.getVoices();
  _voice = vv.find(v => v.lang === SPEECH_LANG  && v.localService)
        || vv.find(v => v.lang.startsWith(LANG) && v.localService)
        || vv.find(v => v.lang === SPEECH_LANG)
        || vv.find(v => v.lang.startsWith(LANG))
        || null;
}

// Call once on first user gesture to select a local voice and pre-warm all phrases
function ensureTTS() {
  if (!VOICE || _ttsReady || !window.speechSynthesis) return;
  _ttsReady = true;
  const init = () => {
    _pickVoice();
    for (const text of Object.values(TV)) {
      const u = new SpeechSynthesisUtterance(text);
      if (_voice) u.voice = _voice;
      u.lang = SPEECH_LANG; u.volume = 0; u.rate = 1.5;
      window.speechSynthesis.speak(u);
    }
  };
  if (window.speechSynthesis.getVoices().length) init();
  else window.speechSynthesis.addEventListener('voiceschanged', init, { once: true });
}

function voicePause(ms) { return VOICE ? new Promise(r => setTimeout(r, ms)) : Promise.resolve(); }

// Inside EldaTV the TV speaks for the game — its browser has no voice, so the browser's speech is silent there.
// EldaTV answers "elda_hello" with "elda_host" {speech}, then says what "elda_speak" sends (EldaSpeaker's voice)
// and reports "elda_spoken" when done. Anywhere else (a phone, a PC) the browser's own speech is used.
const EldaHostSpeech = (() => {
  let available = false, seq = 0;
  const pending = new Map();                      // id → resolve
  const settleAll = () => { pending.forEach(r => r()); pending.clear(); };
  window.addEventListener("message", (e) => {
    if (e.source !== window.parent || window.parent === window) return;
    const d = e.data || {};
    if (d.type === "elda_host" && d.speech) available = true;
    else if (d.type === "elda_spoken" && pending.has(d.id)) { pending.get(d.id)(); pending.delete(d.id); }
  });
  if (window.parent !== window) window.parent.postMessage({ type: "elda_hello" }, "*");
  function speak(text) {
    settleAll();                                  // a new sentence replaces the one being said
    const id = ++seq;
    return new Promise(resolve => {
      pending.set(id, resolve);
      window.parent.postMessage({ type: "elda_speak", id, text }, "*");
      setTimeout(() => { if (pending.has(id)) { pending.delete(id); resolve(); } }, 10000);
    });
  }
  function cancel() { settleAll(); window.parent.postMessage({ type: "elda_speak_cancel" }, "*"); }
  return { get available() { return available; }, speak, cancel };
})();

// Returns a Promise that resolves when speech finishes (or on error/no support)
function speak(text) {
  if (VOICE && EldaHostSpeech.available) return EldaHostSpeech.speak(text);
  if (!VOICE || !window.speechSynthesis) return Promise.resolve();
  window.speechSynthesis.cancel();
  return new Promise(resolve => {
    const u = new SpeechSynthesisUtterance(text);
    if (_voice) u.voice = _voice;
    u.lang    = SPEECH_LANG;
    u.rate    = 1.05;
    u.volume  = 1.0;
    u.onend   = resolve;
    u.onerror = resolve;
    window.speechSynthesis.speak(u);
  });
}

// ── State ─────────────────────────────────────────────────────────────────
let sequence    = [];
let playerInput = [];
let phase       = "idle";   // idle | showing | player | gameover
let level       = 0;
let bestScore   = parseInt(localStorage.getItem("simon_best") || "0", 10);

// ── DOM refs ──────────────────────────────────────────────────────────────
const statusEl   = document.getElementById("status");
const hintEl     = document.getElementById("hint");
const progressEl = document.getElementById("progress");

hintEl.textContent = T.keyHint;

// Attach click handlers to each SVG segment
[0, 1, 2, 3].forEach(i => {
  document.getElementById(`seg-${i}`).addEventListener("click", () => input(i));
});

// ── Segment lighting ──────────────────────────────────────────────────────
function setLit(idx, on) {
  const el = document.getElementById(`seg-${idx}`);
  if (on) {
    el.setAttribute("fill", SEG[idx].lit);
    el.style.filter = `brightness(1.55) drop-shadow(0 0 18px ${SEG[idx].glow})`;
  } else {
    el.setAttribute("fill", SEG[idx].dim);
    el.style.filter = "";
  }
}

// ── Scoreboard ────────────────────────────────────────────────────────────
function setScoreboard() {
  document.getElementById("lbl-level").innerHTML = `${T.level}: <b>${level}</b>`;
  document.getElementById("lbl-score").innerHTML = `${T.score}: <b>${Math.max(0, level - 1)}</b>`;
  document.getElementById("lbl-best").innerHTML  = `${T.best}: <b>${bestScore}</b>`;
}

function setStatus(text, cls) {
  statusEl.textContent = text;
  statusEl.className   = cls;
}

function renderProgress() {
  progressEl.innerHTML = "";
  sequence.forEach((_, i) => {
    const dot = document.createElement("div");
    dot.className = "dot" + (i < playerInput.length ? " done" : "");
    progressEl.appendChild(dot);
  });
}

// ── Flash a segment (light + sound) ──────────────────────────────────────
function flash(idx, duration = 350) {
  return new Promise(resolve => {
    setLit(idx, true);
    playTone(idx, duration);
    setTimeout(() => { setLit(idx, false); resolve(); }, duration);
  });
}

async function showSequence() {
  phase = "showing";
  setStatus(T.watch, "watching");
  await speak(TV.watch);
  await voicePause(400);

  const stepMs = Math.max(200, 500 - level * 12);
  const gapMs  = Math.max(100, stepMs * 0.4);

  for (let i = 0; i < sequence.length; i++) {
    await flash(sequence[i], stepMs);
    if (i < sequence.length - 1) await sleep(gapMs);   // no gap after the last one: the turn starts right away
  }

  // The player may press as soon as the last colour has flashed — "your turn" is said meanwhile (with the voice
  // on), not waited for; a press cuts it short (see input). The online duel does the same.
  setStatus(T.yourTurn, "your-turn");
  phase       = "player";
  playerInput = [];
  renderProgress();
  speak(TV.yourTurn);
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

// ── Player input ──────────────────────────────────────────────────────────
function input(idx) {
  if (audioCtx?.state === "suspended") audioCtx.resume();

  if (phase === "idle" || phase === "gameover") { startGame(); return; }
  if (phase !== "player") return;

  if (VOICE) {                                              // "your turn" still being said: cut it short
    if (EldaHostSpeech.available) EldaHostSpeech.cancel();
    else if (window.speechSynthesis?.speaking) window.speechSynthesis.cancel();
  }
  flash(idx, 250);
  playerInput.push(idx);
  renderProgress();

  const pos = playerInput.length - 1;
  if (playerInput[pos] !== sequence[pos]) {
    phase = "gameover";
    const score = level - 1;
    if (score > bestScore) {
      bestScore = score;
      localStorage.setItem("simon_best", bestScore);
    }
    setStatus(T.wrong, "wrong");
    speak(TV.wrong);
    playWrongSound();
    setTimeout(() => {
      [0, 1, 2, 3].forEach(i => setLit(i, true));
      setTimeout(() => [0, 1, 2, 3].forEach(i => setLit(i, false)), 600);
    }, 150);
    setTimeout(() => {
      setScoreboard();
      setStatus(T.pressAgain, "idle");
      speak(TV.pressAgain);
    }, 1800);
    return;
  }

  if (playerInput.length === sequence.length) setTimeout(nextRound, 700);
}

function nextRound() {
  level++;
  sequence.push(Math.floor(Math.random() * 4));
  setScoreboard();
  showSequence();
}

function startGame() {
  ensureTTS();
  level    = 1;
  sequence = [Math.floor(Math.random() * 4)];
  setScoreboard();
  showSequence();
}

// ── Keyboard ──────────────────────────────────────────────────────────────
// Up=0(Red)  Right=1(Green)  Down=2(Blue)  Left=3(Yellow)
const KEY_MAP = {
  ArrowUp: 0, w: 0, W: 0,
  ArrowRight: 1, d: 1, D: 1,
  ArrowDown: 2, s: 2, S: 2,
  ArrowLeft: 3, a: 3, A: 3,
};

document.addEventListener("keydown", e => {
  if (audioCtx?.state === "suspended") audioCtx.resume();
  if (phase === "idle" || phase === "gameover") {
    if (e.key === "Enter" || e.key === " " || KEY_MAP[e.key] !== undefined) {
      startGame(); return;
    }
  }
  if (KEY_MAP[e.key] !== undefined) { e.preventDefault(); input(KEY_MAP[e.key]); }
  if (e.key === "Escape") window.parent.postMessage({ type: "elda_back" }, "*");
});

// ── Gamepad polling ───────────────────────────────────────────────────────
// A(0)=Red  B(1)=Green  X(2)=Blue  Y(3)=Yellow
// D-pad: Up(12)=Red  Right(15)=Green  Down(13)=Blue  Left(14)=Yellow
const GP_MAP = { 0: 0, 1: 1, 2: 2, 3: 3, 12: 0, 15: 1, 13: 2, 14: 3 };
let _gpPrev = {};
// The d-pad as buttons 12-15 (standard mapping) — or, on many Bluetooth gamepads (8BitDo in D-input mode, …),
// as the first stick's axes: both count, like in the other games
function gpPressed(gp, btn) {
  if (gp.buttons[btn]?.pressed) return true;
  const ax = gp.axes || [];
  if (btn === 12) return ax[1] < -0.5;   // up
  if (btn === 13) return ax[1] >  0.5;   // down
  if (btn === 14) return ax[0] < -0.5;   // left
  if (btn === 15) return ax[0] >  0.5;   // right
  return false;
}

function pollGamepad() {
  const gp = navigator.getGamepads?.()[0];
  if (gp) {
    if (audioCtx?.state === "suspended") audioCtx.resume();
    for (const [btn, idx] of Object.entries(GP_MAP)) {
      const pressed = gpPressed(gp, +btn);
      if (pressed && !_gpPrev[btn]) {
        if (phase === "idle" || phase === "gameover") { startGame(); break; }
        input(idx);
      }
      _gpPrev[btn] = pressed;
    }
    // Start button (9) = back to menu
    if (gp.buttons[9]?.pressed && !_gpPrev[9])
      window.parent.postMessage({ type: "elda_back" }, "*");
    _gpPrev[9] = gp.buttons[9]?.pressed;
  }
  requestAnimationFrame(pollGamepad);
}
requestAnimationFrame(pollGamepad);

// ── Init ──────────────────────────────────────────────────────────────────
setScoreboard();
setStatus(T.pressStart, "idle");
</script>
</body>
</html>

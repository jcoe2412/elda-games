<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Connect 4</title>
<style>
  :root {
    --bg:     #0e0e1c;
    --board:  #0d1f40;
    --hole:   #080818;
    --player: #4488ff;
    --ai:     #ff6633;
    --green:  #22bb33;
    --red:    #dd2200;
    --yellow: #ddaa00;
    --dim:    #555;
    --text:   #e0e0e0;
    /* responsive cell — fits 7 cols + gaps comfortably on screen */
    --cell: min(9vh, 8vw);
    --gap:  8px;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', Arial, sans-serif;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; user-select: none;
  }
  #game {
    display: flex; flex-direction: column;
    align-items: center; gap: 0.8rem;
    padding: 0.5rem;
  }
  h1 {
    font-size: 3rem; font-weight: 900; letter-spacing: .06em;
    color: var(--text);
  }
  #status {
    font-size: 2.2rem; font-weight: 700; min-height: 2.7rem;
    text-align: center; letter-spacing: .02em;
    transition: color .25s;
  }
  #status.your-turn { color: var(--player); }
  #status.waiting   { color: var(--yellow); }
  #status.win       { color: var(--green); }
  #status.lose      { color: var(--red); }
  #status.draw      { color: var(--dim); }
  #status.idle      { color: var(--dim); }

  /* column selector row — sits just above the board */
  #selector-row {
    display: grid;
    grid-template-columns: repeat(7, var(--cell));
    gap: var(--gap);
    padding: 0 var(--gap); /* align with board padding */
    height: calc(var(--cell) * 0.38);
    align-items: center;
  }
  .col-arrow {
    display: flex; align-items: center; justify-content: center;
    font-size: calc(var(--cell) * 0.33);
    color: var(--player);
    opacity: 0;
    transition: opacity .1s, color .1s;
  }
  .col-arrow.active      { opacity: 1; }
  .col-arrow.column-full { color: var(--red); }

  /* board */
  #board {
    display: grid;
    grid-template-columns: repeat(7, var(--cell));
    grid-template-rows:    repeat(6, var(--cell));
    gap: var(--gap);
    background: var(--board);
    padding: var(--gap);
    border-radius: 18px;
    box-shadow: 0 6px 28px rgba(0,0,0,.55);
  }
  .cell {
    width: var(--cell); height: var(--cell);
    border-radius: 50%;
    background: var(--hole);
    cursor: pointer;
    transition: background .12s, box-shadow .12s, filter .12s;
  }
  .cell.player { background: var(--player); }
  .cell.ai     { background: var(--ai); }
  /* ghost: preview of where the piece will land */
  .cell.ghost  { background: rgba(68,136,255,.25); }

  /* winning four cells */
  .cell.player.win { filter: brightness(1.5); box-shadow: 0 0 20px 5px var(--player); }
  .cell.ai.win     { filter: brightness(1.5); box-shadow: 0 0 20px 5px var(--ai); }

  #meta {
    display: flex; align-items: center; gap: 1.2rem;
    color: var(--dim); font-size: 0.9rem;
  }
  #mode-badge {
    padding: .25rem .75rem;
    border: 1px solid #333;
    border-radius: 99px;
  }
</style>
</head>
<body>
<div id="game">
  <h1 id="title-el"></h1>
  <div id="status" class="idle"></div>
  <div id="selector-row"></div>
  <div id="board"></div>
  <div id="meta">
    <span id="mode-badge"></span>
    <span id="hint"></span>
  </div>
</div>

<script>
// ── i18n ──────────────────────────────────────────────────────────────────
// ?lang=en (default) | fr | nl
const LANG = (() => {
  const p = new URLSearchParams(location.search);
  const l = (p.get("lang") || "en").split(/[-_]/)[0].toLowerCase();
  return ["fr", "nl"].includes(l) ? l : "en";
})();

const T = {
  en: {
    title:      "Connect 4",
    yourTurn:   "Your turn",
    aiTurn:     "AI is thinking…",
    youWin:     "You win! 🎉",
    youLose:    "You lose",
    draw:       "Draw!",
    pressAgain: "Press any key to play again",
    hint:       "← →  move   Enter / A  drop",
    modeSingle: "vs AI",
  },
  fr: {
    title:      "Puissance 4",
    yourTurn:   "Votre tour",
    aiTurn:     "L'IA réfléchit…",
    youWin:     "Vous gagnez ! 🎉",
    youLose:    "Vous perdez",
    draw:       "Égalité !",
    pressAgain: "Appuyez sur une touche pour rejouer",
    hint:       "← →  déplacer   Entrée / A  poser",
    modeSingle: "vs IA",
  },
  nl: {
    title:      "Vier op een rij",
    yourTurn:   "Uw beurt",
    aiTurn:     "AI denkt na…",
    youWin:     "U wint! 🎉",
    youLose:    "U verliest",
    draw:       "Gelijkspel!",
    pressAgain: "Druk een toets in om opnieuw te spelen",
    hint:       "← →  bewegen   Enter / A  plaatsen",
    modeSingle: "vs AI",
  },
}[LANG];

// ── Text-to-speech ────────────────────────────────────────────────────────
// ?voice=0  disables TTS and all voice-related pauses; default is enabled
const VOICE = new URLSearchParams(location.search).get("voice") !== "0";
const SPEECH_LANG = { en: "en-US", fr: "fr-FR", nl: "nl-NL" }[LANG];

// Verbose voice prompts — richer than the on-screen labels
const TV = {
  en: {
    yourTurn:   "It's your turn! Drop a blue piece.",
    youWin:     "Congratulations, you win!",
    youLose:    "You lose. Better luck next time!",
    draw:       "It's a draw!",
    pressAgain: "Press any key to play again.",
  },
  fr: {
    yourTurn:   "C'est votre tour ! Placez un jeton bleu.",
    youWin:     "Félicitations, vous gagnez !",
    youLose:    "Vous perdez. Bonne chance la prochaine fois !",
    draw:       "C'est une égalité !",
    pressAgain: "Appuyez sur une touche pour rejouer.",
  },
  nl: {
    yourTurn:   "Het is uw beurt! Laat een blauw stuk vallen.",
    youWin:     "Gefeliciteerd, u wint!",
    youLose:    "U verliest. Veel succes de volgende keer!",
    draw:       "Het is gelijkspel!",
    pressAgain: "Druk een toets in om opnieuw te spelen.",
  },
}[LANG];

let _voice = null, _ttsReady = false;

function _pickVoice() {
  const vv = window.speechSynthesis.getVoices();
  _voice = vv.find(v => v.lang === SPEECH_LANG  && v.localService)
        || vv.find(v => v.lang.startsWith(LANG) && v.localService)
        || vv.find(v => v.lang === SPEECH_LANG)
        || vv.find(v => v.lang.startsWith(LANG))
        || null;
}

function ensureTTS() {
  if (!VOICE || _ttsReady || !window.speechSynthesis) return;
  _ttsReady = true;
  const init = () => {
    _pickVoice();
    for (const text of Object.values(TV)) {
      const u = new SpeechSynthesisUtterance(text);
      if (_voice) u.voice = _voice;
      u.lang = SPEECH_LANG; u.volume = 0; u.rate = 1.5;
      window.speechSynthesis.speak(u);
    }
  };
  if (window.speechSynthesis.getVoices().length) init();
  else window.speechSynthesis.addEventListener('voiceschanged', init, { once: true });
}

function speak(text) {
  if (!VOICE || !window.speechSynthesis) return Promise.resolve();
  window.speechSynthesis.cancel();
  return new Promise(resolve => {
    const u = new SpeechSynthesisUtterance(text);
    if (_voice) u.voice = _voice;
    u.lang = SPEECH_LANG; u.rate = 1.05; u.volume = 1.0;
    u.onend = resolve; u.onerror = resolve;
    window.speechSynthesis.speak(u);
  });
}

// ── Audio ──────────────────────────────────────────────────────────────────
let audioCtx = null;
function getCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
function unlockAudio() { if (audioCtx?.state === "suspended") audioCtx.resume(); }

function beep(freq, type, duration, volume = 0.35, startDelay = 0) {
  try {
    const ctx = getCtx(), osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.type = type; osc.frequency.value = freq;
    const t = ctx.currentTime + startDelay;
    gain.gain.setValueAtTime(volume, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + duration);
    osc.start(t); osc.stop(t + duration);
  } catch (_) {}
}

// Short thud when a piece lands
function playDrop() {
  beep(200, "triangle", 0.07, 0.4);
  beep(130, "sine",     0.11, 0.2, 0.06);
}
function playWin() {
  [[523,0],[659,.14],[784,.28],[1046,.42]].forEach(([f,d]) => beep(f,"sine",.28,.4,d));
}
function playLose() {
  beep(200, "sawtooth", .35, .25, 0);
  beep(160, "sawtooth", .45, .25, .35);
}
function playDraw() {
  beep(350, "sine", .2, .3, 0);
  beep(350, "sine", .2, .3, .28);
}

// ── Game constants ─────────────────────────────────────────────────────────
const ROWS = 6, COLS = 7;
const PLAYER = 1, AI = 2;
// Try center columns first — dramatically improves alpha-beta pruning
const COL_ORDER = [3, 2, 4, 1, 5, 0, 6];

// ── State ──────────────────────────────────────────────────────────────────
let board      = [];
let focusCol   = 3;
let gameOver   = false;
let aiThinking = false;
let winSet     = new Set();

// ── DOM ────────────────────────────────────────────────────────────────────
const statusEl  = document.getElementById("status");
const boardEl   = document.getElementById("board");
const selectorEl = document.getElementById("selector-row");

document.getElementById("title-el").textContent    = T.title;
document.getElementById("mode-badge").textContent  = T.modeSingle;
document.getElementById("hint").textContent        = T.hint;

// Build selector arrow elements once
for (let c = 0; c < COLS; c++) {
  const el = document.createElement("div");
  el.className = "col-arrow";
  el.id = `arrow-${c}`;
  el.textContent = "▼";
  selectorEl.appendChild(el);
}

// ── Board helpers ──────────────────────────────────────────────────────────
function emptyBoard() {
  return Array.from({ length: ROWS }, () => Array(COLS).fill(0));
}

// Lowest empty row in a column, or -1 if full
function getRow(b, col) {
  for (let r = ROWS - 1; r >= 0; r--) {
    if (b[r][col] === 0) return r;
  }
  return -1;
}

// ── Rendering ──────────────────────────────────────────────────────────────
function renderBoard() {
  boardEl.innerHTML = "";
  // Where the piece will land in the focused column (ghost preview)
  const ghostRow = (!gameOver && !aiThinking) ? getRow(board, focusCol) : -1;

  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const cell = document.createElement("div");
      cell.className = "cell";
      const v = board[r][c];
      if (v === PLAYER) {
        cell.classList.add("player");
        if (winSet.has(`${r},${c}`)) cell.classList.add("win");
      } else if (v === AI) {
        cell.classList.add("ai");
        if (winSet.has(`${r},${c}`)) cell.classList.add("win");
      } else if (r === ghostRow && c === focusCol) {
        cell.classList.add("ghost");
      }
      // Click any cell in column c to drop there
      cell.addEventListener("click", () => { focusCol = c; place(); });
      boardEl.appendChild(cell);
    }
  }

  // Update selector arrows
  for (let c = 0; c < COLS; c++) {
    const el = document.getElementById(`arrow-${c}`);
    const full = getRow(board, c) === -1;
    el.classList.toggle("active",      c === focusCol && !gameOver && !aiThinking);
    el.classList.toggle("column-full", c === focusCol && full);
  }
}

function setFocus(col) {
  focusCol = Math.max(0, Math.min(COLS - 1, col));
  renderBoard();
}

function setStatus(text, cls) {
  statusEl.textContent = text;
  statusEl.className   = cls;
}

// ── Win detection ──────────────────────────────────────────────────────────
function checkWinner(b) {
  const win4 = (cells) => {
    const v = cells[0];
    return v && cells.every(x => x === v) ? v : 0;
  };

  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c <= COLS - 4; c++) {
      const line = [[r,c],[r,c+1],[r,c+2],[r,c+3]];
      const w = win4(line.map(([rr,cc]) => b[rr][cc]));
      if (w) return { winner: w, line };
    }
  for (let r = 0; r <= ROWS - 4; r++)
    for (let c = 0; c < COLS; c++) {
      const line = [[r,c],[r+1,c],[r+2,c],[r+3,c]];
      const w = win4(line.map(([rr,cc]) => b[rr][cc]));
      if (w) return { winner: w, line };
    }
  for (let r = 0; r <= ROWS - 4; r++)
    for (let c = 0; c <= COLS - 4; c++) {
      const line = [[r,c],[r+1,c+1],[r+2,c+2],[r+3,c+3]];
      const w = win4(line.map(([rr,cc]) => b[rr][cc]));
      if (w) return { winner: w, line };
    }
  for (let r = 3; r < ROWS; r++)
    for (let c = 0; c <= COLS - 4; c++) {
      const line = [[r,c],[r-1,c+1],[r-2,c+2],[r-3,c+3]];
      const w = win4(line.map(([rr,cc]) => b[rr][cc]));
      if (w) return { winner: w, line };
    }

  if (b[0].every(x => x !== 0)) return { winner: 0 }; // draw
  return null;
}

// ── AI — minimax with alpha-beta pruning ───────────────────────────────────
function scoreWindow(cells, piece) {
  const opp   = piece === AI ? PLAYER : AI;
  const mine  = cells.filter(x => x === piece).length;
  const empty = cells.filter(x => x === 0).length;
  const oops  = cells.filter(x => x === opp).length;
  if (mine > 0 && oops > 0) return 0;  // mixed — worthless
  if (mine === 4) return 1000;
  if (mine === 3 && empty === 1) return 10;
  if (mine === 2 && empty === 2) return 3;
  if (oops === 3 && empty === 1) return -50;
  return 0;
}

function scoreBoard(b) {
  let s = 0;
  // Prefer centre column
  for (let r = 0; r < ROWS; r++) if (b[r][3] === AI) s += 4;

  const windows = [];
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c <= COLS - 4; c++)
      windows.push([b[r][c], b[r][c+1], b[r][c+2], b[r][c+3]]);
  for (let r = 0; r <= ROWS - 4; r++)
    for (let c = 0; c < COLS; c++)
      windows.push([b[r][c], b[r+1][c], b[r+2][c], b[r+3][c]]);
  for (let r = 0; r <= ROWS - 4; r++)
    for (let c = 0; c <= COLS - 4; c++)
      windows.push([b[r][c], b[r+1][c+1], b[r+2][c+2], b[r+3][c+3]]);
  for (let r = 3; r < ROWS; r++)
    for (let c = 0; c <= COLS - 4; c++)
      windows.push([b[r][c], b[r-1][c+1], b[r-2][c+2], b[r-3][c+3]]);

  for (const w of windows) s += scoreWindow(w, AI);
  return s;
}

// Mutate-and-restore minimax (no board copying — fast)
function minimax(b, depth, alpha, beta, maximizing) {
  const result = checkWinner(b);
  if (result !== null) {
    if (result.winner === AI)     return  10000 + depth;
    if (result.winner === PLAYER) return -10000 - depth;
    return 0;
  }
  if (depth === 0) return scoreBoard(b);

  const cols = COL_ORDER.filter(c => getRow(b, c) !== -1);

  if (maximizing) {
    let best = -Infinity;
    for (const col of cols) {
      const row = getRow(b, col);
      b[row][col] = AI;
      best = Math.max(best, minimax(b, depth - 1, alpha, beta, false));
      b[row][col] = 0;
      alpha = Math.max(alpha, best);
      if (alpha >= beta) break;
    }
    return best;
  } else {
    let best = Infinity;
    for (const col of cols) {
      const row = getRow(b, col);
      b[row][col] = PLAYER;
      best = Math.min(best, minimax(b, depth - 1, alpha, beta, true));
      b[row][col] = 0;
      beta = Math.min(beta, best);
      if (alpha >= beta) break;
    }
    return best;
  }
}

function pickAICol() {
  // 25% random move keeps the game beatable
  if (Math.random() < 0.25) {
    const valid = COL_ORDER.filter(c => getRow(board, c) !== -1);
    return valid[Math.floor(Math.random() * valid.length)];
  }
  let best = -Infinity, bestCol = COL_ORDER.find(c => getRow(board, c) !== -1);
  for (const col of COL_ORDER) {
    const row = getRow(board, col);
    if (row === -1) continue;
    board[row][col] = AI;
    const s = minimax(board, 4, -Infinity, Infinity, false);
    board[row][col] = 0;
    if (s > best) { best = s; bestCol = col; }
  }
  return bestCol;
}

// ── Game flow ──────────────────────────────────────────────────────────────
function place() {
  if (gameOver || aiThinking) return;
  const row = getRow(board, focusCol);
  if (row === -1) return;  // column full

  board[row][focusCol] = PLAYER;
  aiThinking = true;   // set before render so ghost is hidden immediately
  playDrop();
  renderBoard();

  const result = checkWinner(board);
  if (result !== null) { aiThinking = false; endGame(result); return; }

  setStatus(T.aiTurn, "waiting");
  setTimeout(aiMove, 650);
}

function aiMove() {
  const col = pickAICol();
  const row = getRow(board, col);
  board[row][col] = AI;
  playDrop();
  aiThinking = false;
  renderBoard();

  const result = checkWinner(board);
  if (result !== null) { endGame(result); return; }

  setStatus(T.yourTurn, "your-turn");
  speak(TV.yourTurn);
}

function endGame(result) {
  gameOver = true;
  if (result.line) winSet = new Set(result.line.map(([r,c]) => `${r},${c}`));
  renderBoard();

  if (result.winner === 0) {
    setStatus(T.draw, "draw");
    speak(TV.draw);
    playDraw();
  } else if (result.winner === PLAYER) {
    setStatus(T.youWin, "win");
    speak(TV.youWin);
    playWin();
  } else {
    setStatus(T.youLose, "lose");
    speak(TV.youLose);
    playLose();
  }

  setTimeout(() => {
    setStatus(T.pressAgain, "idle");
    speak(TV.pressAgain);
  }, 2000);
}

function newGame() {
  ensureTTS();
  board      = emptyBoard();
  focusCol   = 3;
  gameOver   = false;
  aiThinking = false;
  winSet     = new Set();
  renderBoard();
  setStatus(T.yourTurn, "your-turn");
  speak(TV.yourTurn);
}

// ── Keyboard ───────────────────────────────────────────────────────────────
document.addEventListener("keydown", e => {
  unlockAudio();
  ensureTTS();
  if (gameOver) {
    if (e.key === "Escape") { window.parent.postMessage({ type: "elda_back" }, "*"); return; }
    newGame(); return;
  }
  switch (e.key) {
    case "ArrowLeft":  e.preventDefault(); setFocus(focusCol - 1); break;
    case "ArrowRight": e.preventDefault(); setFocus(focusCol + 1); break;
    case "ArrowUp":    e.preventDefault(); break; // no-op (avoids page scroll)
    case "ArrowDown":  e.preventDefault(); place(); break; // intuitive: down = drop
    case "Enter":
    case " ":          place(); break;
    case "Escape":     window.parent.postMessage({ type: "elda_back" }, "*"); break;
  }
});

// ── Gamepad ────────────────────────────────────────────────────────────────
let _gpPrev = [];
function pollGamepad() {
  const gp = navigator.getGamepads?.()[0];
  if (gp) {
    unlockAudio();
    const hit = i => gp.buttons[i]?.pressed && !_gpPrev[i];
    if (gameOver) {
      if (hit(9)) window.parent.postMessage({ type: "elda_back" }, "*");
      else if ([0,1,2,3,12,13,14,15].some(hit)) newGame();
    } else {
      if (hit(14) || (gp.axes[0] < -.5 && !_gpPrev.axL)) setFocus(focusCol - 1);
      if (hit(15) || (gp.axes[0] >  .5 && !_gpPrev.axR)) setFocus(focusCol + 1);
      if (hit(13) || (gp.axes[1] >  .5 && !_gpPrev.axD)) place(); // d-pad down = drop
      if (hit(0))  place();  // A = drop
      if (hit(1))  window.parent.postMessage({ type: "elda_back" }, "*");
      if (hit(9))  window.parent.postMessage({ type: "elda_back" }, "*");
    }
    _gpPrev = gp.buttons.map(b => b.pressed);
    _gpPrev.axL = gp.axes[0] < -.5;
    _gpPrev.axR = gp.axes[0] >  .5;
    _gpPrev.axD = gp.axes[1] >  .5;
  }
  requestAnimationFrame(pollGamepad);
}
requestAnimationFrame(pollGamepad);

// ── Start ──────────────────────────────────────────────────────────────────
newGame();
</script>
</body>
</html>
